name: Build gnote cross platform

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-windows:
     runs-on: windows-latest
     strategy:
       fail-fast: false 
       matrix:
          presets: [msvc-release, msvc-debug]
  
  steps:
    - name: Checkout git
    - uses: actions/checkout@v4
      with:
        repository: 'MikeJohnnyP/gnote'
        submodules: true
        lfs: true

    - name: Get Cmake and Ninja
    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.25.0"
        ninjaVersion: "^1.11.1"

    - name: Build requiring CL.EXE
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'amd64_x86'

    - name: Configure (${{ matrix.preset }})
      run: cmake --preset ${{ matrix.preset }}
    - name: Build (${{ matrix.preset }})
      run: cmake --build --preset ${{ matrix.preset }}


